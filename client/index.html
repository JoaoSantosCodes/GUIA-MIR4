<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Guia Completo MIR4</title>
    <meta name="description" content="Guia completo e interativo do MMORPG MIR4: Espíritos (Pets), Codex, Locais de Farm, Classes e Economia." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <script>
      // Restaurar tema persistente do localStorage antes do primeiro paint (evita flash de tema errado)
      try {
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "light") document.documentElement.classList.remove("dark");
        else document.documentElement.classList.add("dark");
      } catch (_) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
